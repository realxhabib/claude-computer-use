[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-computer-use-local"
version = "0.4.1"
description = "Local desktop controls for Claude Code on Windows and macOS"
requires-python = ">=3.10"
dependencies = ["mcp>=1.12,<2", "PyAutoGUI>=0.9.54,<1", "Pillow>=10,<13", "psutil>=5.9,<8", "PySide6>=6.6,<7; sys_platform == 'win32' or sys_platform == 'darwin'", "pynput>=1.7,<2; sys_platform == 'win32' or sys_platform == 'darwin'",
    "pywin32>=306; sys_platform == 'win32'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'"]

[project.scripts]
claude-computer-use = "claude_computer_use.server:main"
claude-computer-unicode-probe = "claude_computer_use.unicode_probe:main"

[tool.setuptools.packages.find]
where = ["src"]
